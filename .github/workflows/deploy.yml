name: Build, verify, deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (Lean version manager)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lake build
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: lake-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-

      - name: Build and kernel-check all proofs
        run: lake build

      - name: Extract the dependency graph
        run: |
          lake build extract
          lake exe extract Foundations Foundations > site/graph.json

      - name: Check axioms (only propext, choice, quotients; no sorry)
        run: python3 scripts/check_axioms.py site/graph.json

      - name: Build the site
        run: python3 scripts/build_site.py site/graph.json "https://github.com/${{ github.repository }}"

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/dist

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=maths --branch=main
