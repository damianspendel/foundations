name = "Foundations"
version = "0.1.0"
defaultTargets = ["Foundations"]

[[lean_lib]]
name = "Foundations"

[[lean_exe]]
name = "extract"
root = "Extract"
supportInterpreter = true

# The exercise layer (see EXERCISES.md). Only the worked solutions are built; the generated
# student files in Exercises/Problems contain `sorry` and are checked with `lake env lean`.
[[lean_lib]]
name = "Exercises"
globs = ["Exercises.Solutions.*"]
